
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#041020">
<title>Forgot Password | HassanFX</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #123052 0%, transparent 45%),
    #041020;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 35px 28px;
  border: 1px solid #243b56;
  border-radius: 20px;
  background: rgba(9,24,43,0.97);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.logo {
  margin-bottom: 25px;
  color: #00d9a0;
  font-size: 30px;
  font-weight: 800;
  text-align: center;
}

.logo span {
  color: white;
}

.lock {
  width: 65px;
  height: 65px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0,217,160,0.12);
  color: #00d9a0;
  font-size: 30px;
}

h1 {
  margin-bottom: 12px;
  font-size: 25px;
  text-align: center;
}

.subtitle {
  margin-bottom: 28px;
  color: #a8bad0;
  font-size: 14px;
  line-height: 1.7;
  text-align: center;
}

label {
  display: block;
  margin-bottom: 9px;
  color: #dce7f5;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  border: 1px solid #30465f;
  border-radius: 10px;
  outline: none;
  background: #071527;
  color: white;
  font-size: 15px;
}

input:focus {
  border-color: #00d9a0;
  box-shadow: 0 0 0 3px rgba(0,217,160,0.12);
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #00d9a0;
  color: #041020;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  background: #00efb1;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  min-height: 22px;
  margin-top: 17px;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  overflow-wrap: anywhere;
}

.back {
  margin-top: 25px;
  text-align: center;
  font-size: 14px;
}

.back a {
  color: #00d9a0;
  text-decoration: none;
}

.back a:hover {
  text-decoration: underline;
}

.footer {
  margin-top: 28px;
  color: #72859c;
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<main class="card">

  <div class="logo">Hassan<span>FX</span></div>

  <div class="lock">🔒</div>

  <h1>Forgot Password?</h1>

  <p class="subtitle">
    Don't worry! Enter your registered email address
    and we will help you reset your password.
  </p>

  <form id="forgotForm">

    <label for="email">Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <button id="sendButton" type="submit">
      SEND RESET LINK →
    </button>

    <p id="message" role="status" aria-live="polite"></p>

  </form>

  <div class="back">
    <a href="login.html">← Back to Login</a>
  </div>

  <div class="footer">
    © 2026 HassanFX. All rights reserved.
  </div>

</main>


<script>
const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const sendButton = document.getElementById("sendButton");
const message = document.getElementById("message");

const API_URL =
  "https://traderscheem-backend-pkn6.onrender.com";

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = emailInput.value.trim();

  sendButton.disabled = true;
  sendButton.textContent = "SENDING...";
  message.textContent = "";

  try {
    const response = await fetch(
      API_URL + "/api/auth/forgot-password",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      }
    );

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error("Server returned an invalid response. Please try again.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Could not send reset link.");
    }

    message.style.color = "#00d9a0";
    message.textContent =
      "If this email is registered, a reset link has been sent. Check your inbox and spam folder.";

  } catch(error) {
    message.style.color = "#ff7777";
    message.textContent = error.message;
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "SEND RESET LINK →";
  }
});
</script>


</body>
</html>
