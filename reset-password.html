
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HassanFX | Reset Password</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#06101f;color:white;font-family:Arial,sans-serif;
  padding:20px
}
.card{
  width:100%;max-width:400px;background:#101e32;
  padding:30px;border-radius:16px;border:1px solid #263b55
}
h2{text-align:center;color:#00e6a0}
p{text-align:center;color:#aab8ca}
input,button{
  width:100%;padding:14px;margin-top:14px;
  border-radius:8px;font-size:16px
}
input{background:#071426;color:white;border:1px solid #344a65}
button{
  background:#00d995;color:#06101f;border:0;
  font-weight:bold;cursor:pointer
}
#message{text-align:center;margin-top:15px}
a{color:#00e6a0}
</style>
</head>
<body>
<div class="card">
<h2>Reset Password</h2>
<p>Enter your new password below.</p>

<form id="resetForm">
<input id="password" type="password"
placeholder="New password (minimum 10 characters)"
minlength="10" required>

<input id="confirmPassword" type="password"
placeholder="Confirm new password" required>

<button type="submit">Change Password</button>
</form>

<div id="message"></div>
<p><a href="login.html">Back to Login</a></p>
</div>

<script>
const API = "https://traderscheem-backend-pkn6.onrender.com";

const token = new URLSearchParams(location.search).get("token");
const form = document.getElementById("resetForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(!token){
    message.textContent = "Invalid or missing reset link.";
    return;
  }

  if(password.length < 10){
    message.textContent = "Password must have at least 10 characters.";
    return;
  }

  if(password !== confirmPassword){
    message.textContent = "Passwords do not match.";
    return;
  }

  message.textContent = "Updating password...";

  try{
    const response = await fetch(
      API + "/api/auth/reset-password",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({token,password})
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Password reset failed.");
    }

    message.textContent = data.message;
    form.reset();
  }catch(error){
    message.textContent = error.message;
  }
});
</script>
</body>
  </html>
